[package]
name = "omnitool"
version = "0.9.0"
edition = "2021"
default-run = "OmniTool"

[features]
dev-tools = []
# Lets `nav_probe cmd` drive the `level_nav_*` Tauri commands. Off by default
# because it needs `pub mod commands_level_nav;` in lib.rs, and the default build
# must stay green before that line lands.
nav-commands = []

[lib]
name = "omnitool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "OmniTool"
path = "src/main.rs"

[[bin]]
name = "dev_dump_scene"
path = "src/bin/dev_dump_scene.rs"

[[bin]]
name = "dump_region"
path = "src/bin/dump_region.rs"

[[bin]]
name = "block2_probe"
path = "src/bin/block2_probe.rs"

[[bin]]
name = "zone_check"
path = "src/bin/zone_check.rs"

[[bin]]
name = "level_check"
path = "src/bin/level_check.rs"

[[bin]]
name = "e2e_check"
path = "src/bin/e2e_check.rs"

[[bin]]
name = "level_asset_check"
path = "src/bin/level_asset_check.rs"

[[bin]]
name = "coverage_audit"
path = "src/bin/coverage_audit.rs"

[[bin]]
name = "name_source_check"
path = "src/bin/name_source_check.rs"

[[bin]]
name = "light_probe"
path = "src/bin/light_probe.rs"

[[bin]]
name = "zone_bounds"
path = "src/bin/zone_bounds.rs"

[[bin]]
name = "entity_probe"
path = "src/bin/entity_probe.rs"

[[bin]]
name = "missing_probe"
path = "src/bin/missing_probe.rs"

[[bin]]
name = "texture_probe"
path = "src/bin/texture_probe.rs"

[[bin]]
name = "blend_probe"
path = "src/bin/blend_probe.rs"

[[bin]]
name = "shader_dump"
path = "src/bin/shader_dump.rs"

[[bin]]
name = "instance_placement"
path = "src/bin/instance_placement.rs"

[[bin]]
name = "nav_probe"
path = "src/bin/nav_probe.rs"

[[bin]]
name = "world_probe"
path = "src/bin/world_probe.rs"

[[bin]]
name = "dag_check"
path = "src/bin/dag_check.rs"

[[bin]]
name = "diag"
path = "src/bin/diag.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_subset"
path = "src/bin/dump_subset.rs"
required-features = ["dev-tools"]

[[bin]]
name = "inject_once"
path = "src/bin/inject_once.rs"
required-features = ["dev-tools"]

[[bin]]
name = "roundtrip"
path = "src/bin/roundtrip.rs"
required-features = ["dev-tools"]

[[bin]]
name = "roundtrip_gltf"
path = "src/bin/roundtrip_gltf.rs"
required-features = ["dev-tools"]

[[bin]]
name = "sections"
path = "src/bin/sections.rs"
required-features = ["dev-tools"]

[[bin]]
name = "check_actor_hashes"
path = "src/bin/check_actor_hashes.rs"
required-features = ["dev-tools"]

[[bin]]
name = "roundtrip_actor"
path = "src/bin/roundtrip_actor.rs"
required-features = ["dev-tools"]

[[bin]]
name = "toc_asset_diag"
path = "src/bin/toc_asset_diag.rs"
required-features = ["dev-tools"]

[[bin]]
name = "material_dump"
path = "src/bin/material_dump.rs"
required-features = ["dev-tools"]

[[bin]]
name = "roundtrip_material"
path = "src/bin/roundtrip_material.rs"
required-features = ["dev-tools"]

[[bin]]
name = "material_names_harvest"
path = "src/bin/material_names_harvest.rs"
required-features = ["dev-tools"]

[[bin]]
name = "atmosphere_dump"
path = "src/bin/atmosphere_dump.rs"
required-features = ["dev-tools"]

[[bin]]
name = "model_audit"
path = "src/bin/model_audit.rs"
required-features = ["dev-tools"]

[[bin]]
name = "model_dump"
path = "src/bin/model_dump.rs"
required-features = ["dev-tools"]

[[bin]]
name = "arena_dump"
path = "src/bin/arena_dump.rs"
required-features = ["dev-tools"]

[[bin]]
name = "zone_probe"
path = "src/bin/zone_probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "zone_place"
path = "src/bin/zone_place.rs"
required-features = ["dev-tools"]

[[bin]]
name = "scene_import"
path = "src/bin/scene_import.rs"
required-features = ["dev-tools"]

[[bin]]
name = "model_import"
path = "src/bin/model_import.rs"
required-features = ["dev-tools"]

[[bin]]
name = "asset_extract"
path = "src/bin/asset_extract.rs"
required-features = ["dev-tools"]

[[bin]]
name = "config_set"
path = "src/bin/config_set.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dag_query"
path = "src/bin/dag_query.rs"
required-features = ["dev-tools"]

[[bin]]
name = "png2texture"
path = "src/bin/png2texture.rs"
required-features = ["dev-tools"]

[[bin]]
name = "model_extract"
path = "src/bin/model_extract.rs"
required-features = ["dev-tools"]

[[bin]]
name = "mesh_edit_check"
path = "src/bin/mesh_edit_check.rs"
required-features = ["dev-tools"]

[[bin]]
name = "material_audit"
path = "src/bin/material_audit.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dag_dump"
path = "src/bin/dag_dump.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dyn_chain"
path = "src/bin/dyn_chain.rs"
required-features = ["dev-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
serde          = { version = "1", features = ["derive"] }
serde_json     = { version = "1", features = ["preserve_order"] }
byteorder      = "1"
lz4_flex       = "0.11"
glam           = "0.29"
thiserror      = "2"
log            = "0.4"
flate2         = "1"
zip            = "2"
walkdir        = "2"
tauri-plugin-shell = "2"
libloading     = "0.8"
texture2ddecoder = "0.1.2"
image = "0.25.10"
base64 = "0.22.1"
dirs = "5"
rayon = "1"
memmap2 = "0.9"
dashmap = "6"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
ww2ogg = "0.1"
gltf           = { version = "1.4", features = ["extras"] }
toml_edit      = "0.25"

[profile.release]
opt-level    = 3
lto          = true
codegen-units = 1
panic        = "abort"
strip        = true

[[bin]]
name = "prius_probe"
path = "src/bin/prius_probe.rs"

[[bin]]
name = "script_probe"
path = "src/bin/script_probe.rs"

[[bin]]
name = "integration_check"
path = "src/bin/integration_check.rs"

[[bin]]
name = "gap_probe"
path = "src/bin/gap_probe.rs"

[[bin]]
name = "conduit_probe"
path = "src/bin/conduit_probe.rs"

[[bin]]
name = "refs_probe"
path = "src/bin/refs_probe.rs"
